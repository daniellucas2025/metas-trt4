<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="dlGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="dlGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Circulo de Foco Central -->
  <circle cx="256" cy="235" r="150" fill="#1e293b" opacity="0.35"/>
  <circle cx="256" cy="235" r="150" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Letra D (Estilizada) -->
  <path d="M 145 150 L 210 150 C 265 150 285 185 285 235 C 285 285 265 320 210 320 L 145 320 Z M 182 185 L 182 285 L 206 285 C 236 285 248 262 248 235 C 248 208 236 185 206 185 Z" fill="url(#dlGradD)" filter="url(#glow)"/>

  <!-- Letra L (Entrelaçada Moderna) -->
  <path d="M 275 168 L 312 168 L 312 285 L 372 285 C 378 285 382 290 382 296 L 382 320 L 275 320 Z" fill="url(#dlGradL)" filter="url(#glow)"/>

  <!-- Estrela de Foco no Topo -->
  <polygon points="256,85 263,103 282,106 267,118 272,136 256,125 240,136 245,118 230,106 249,103" fill="#fbbf24"/>

  <!-- Livro de Estudos na Base -->
  <path d="M 195 365 Q 256 350 317 365 L 310 383 Q 256 370 202 383 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <line x1="256" y1="358" x2="256" y2="390" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Assinatura ESTUDOS DL -->
  <text x="256" y="435" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="900" letter-spacing="5">ESTUDOS DL</text>
  <text x="256" y="468" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="4">PLATAFORMA TRT-4</text>
</svg>